<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- CONCEPT 1: Chunky / Nickelodeon
       Fat rounded strokes, playful, hard drop shadow.
       Think Trapper Keeper / Rugrats / Fresh Prince title cards. -->
  <rect width="400" height="400" fill="#f5c542"/>

  <!-- offset shadow copy -->
  <g transform="translate(12, 12)">
    <path d="M 90 90 L 190 300 L 210 300 L 310 90 L 260 90 L 200 220 L 140 90 Z"
          fill="#111" stroke="#111" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <!-- main V -->
  <path d="M 90 90 L 190 300 L 210 300 L 310 90 L 260 90 L 200 220 L 140 90 Z"
        fill="#e0468a" stroke="#111" stroke-width="18" stroke-linejoin="round"/>

  <!-- optional wordmark -->
  <text x="200" y="365" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif"
        font-weight="900" font-size="44" fill="#111" letter-spacing="6">VIBE</text>
</svg>
