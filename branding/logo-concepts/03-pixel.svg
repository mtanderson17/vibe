<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" shape-rendering="crispEdges">
  <!-- CONCEPT 3: 8-bit CRT / terminal green
       Pixel-block V, phosphor green on black, faint scanlines.
       Think Sega Genesis boot, Fallout Pip-Boy, hacker terminal chic. -->
  <rect width="400" height="400" fill="#0b1108"/>

  <!-- pixel V, each square is 24px, grid starts at (76, 76) -->
  <!-- V shape drawn as filled cells; row-by-row -->
  <g fill="#7fff5a">
    <!-- row 1 (y=80): outer arms -->
    <rect x="80"  y="80"  width="24" height="24"/>
    <rect x="104" y="80"  width="24" height="24"/>
    <rect x="272" y="80"  width="24" height="24"/>
    <rect x="296" y="80"  width="24" height="24"/>
    <!-- row 2 -->
    <rect x="80"  y="104" width="24" height="24"/>
    <rect x="104" y="104" width="24" height="24"/>
    <rect x="296" y="104" width="24" height="24"/>
    <rect x="272" y="104" width="24" height="24"/>
    <!-- row 3 -->
    <rect x="104" y="128" width="24" height="24"/>
    <rect x="128" y="128" width="24" height="24"/>
    <rect x="248" y="128" width="24" height="24"/>
    <rect x="272" y="128" width="24" height="24"/>
    <!-- row 4 -->
    <rect x="128" y="152" width="24" height="24"/>
    <rect x="152" y="152" width="24" height="24"/>
    <rect x="224" y="152" width="24" height="24"/>
    <rect x="248" y="152" width="24" height="24"/>
    <!-- row 5 -->
    <rect x="152" y="176" width="24" height="24"/>
    <rect x="176" y="176" width="24" height="24"/>
    <rect x="200" y="176" width="24" height="24"/>
    <rect x="224" y="176" width="24" height="24"/>
    <!-- row 6 -->
    <rect x="176" y="200" width="24" height="24"/>
    <rect x="200" y="200" width="24" height="24"/>
    <!-- row 7 (tip) -->
    <rect x="188" y="224" width="24" height="24"/>
  </g>

  <!-- scanlines -->
  <g fill="#000" opacity="0.28">
    <rect x="0" y="0"   width="400" height="2"/>
    <rect x="0" y="6"   width="400" height="2"/>
