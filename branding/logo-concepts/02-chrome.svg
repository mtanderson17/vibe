<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- CONCEPT 2: MTV chrome / TRL
       Metallic gradient V with a magenta-cyan chromatic slice underneath.
       Think MTV logo, Total Request Live, Windows 95 splash. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f5f5f5"/>
      <stop offset="35%" stop-color="#c0c0c0"/>
      <stop offset="55%" stop-color="#4a4a4a"/>
      <stop offset="70%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2fbf"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="#0a0a12"/>

  <!-- neon underline stripe (chromatic aberration feel) -->
  <rect x="60" y="322" width="280" height="10" fill="url(#stripe)"/>
  <rect x="60" y="336" width="280" height="4"  fill="#ff2fbf" opacity="0.5"/>
  <rect x="60" y="344" width="280" height="2"  fill="#00e5ff" opacity="0.5"/>

  <!-- chrome V with hard bevel -->
  <path d="M 90 90 L 195 305 L 205 305 L 310 90 L 258 90 L 200 220 L 142 90 Z"
        fill="url(#chrome)" stroke="#000" stroke-width="4" stroke-linejoin="miter"/>

  <!-- highlight streak -->
  <path d="M 120 100 L 200 260 L 195 275 L 105 105 Z"
        fill="#fff" opacity="0.55"/>

  <text x="200" y="380" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif"
        font-weight="900" font-size="24" fill="#e5e5e5" letter-spacing="14">VIBE</text>
</svg>
