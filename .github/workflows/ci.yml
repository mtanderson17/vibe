name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets you re-run the matrix by hand from the Actions tab without pushing.
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other two platforms because one failed — a platform-
      # specific break is exactly what this matrix exists to show.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        include:
          # Node 22 on Linux only: catches runtime deprecations early without
          # tripling the matrix. Bump the primary to 22 when Electron does.
          - os: ubuntu-latest
            node: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
