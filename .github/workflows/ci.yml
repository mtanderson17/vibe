name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets you re-run the matrix by hand from the Actions tab without pushing.
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other two platforms because one failed — a platform-
      # specific break is exactly what this matrix exists to show.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        include:
          # Node 22 on Linux only: catches runtime deprecations early without
          # tripling the matrix. Bump the primary to 22 when Electron does.
          - os: ubuntu-latest
            node: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Does the app actually start? The check job proves modules behave and that
  # the bundle builds; nothing there boots Electron, opens a window, or mounts
  # the renderer. Until this existed, "it runs on macOS" was an assumption.
  #
  # Kept as its own job, one Node version per platform: it is the most likely
  # thing here to be flaky, and a red `check` should always mean real breakage.
  smoke:
    name: smoke · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Linux runners are headless, so Electron needs a virtual display.
      - name: Smoke (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1400x900x24" npm run smoke

      - name: Smoke
        if: runner.os != 'Linux'
        run: npm run smoke
